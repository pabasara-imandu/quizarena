# Render Blueprint — the SERVER only.
#
# The client half goes to Netlify (see netlify.toml and DEPLOY.md), so this
# blueprint creates one service, not two. Fewer moving parts, and it stays
# inside a single free web service.
#
# You do not have to use this file. Creating the service by hand in the Render
# dashboard does exactly the same thing — see DEPLOY.md Option 2.
services:
  - type: web
    name: quizarena-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to your Netlify site URL after the client is deployed,
      # e.g. https://quizarena.netlify.app
      # Without it, students are blocked by CORS.
      - key: CLIENT_ORIGIN
        sync: false
      # Optional: real AI question generation instead of the offline scaffold.
      - key: ANTHROPIC_API_KEY
        sync: false
